# ══════════════════════════════════════════════════════════
# CAMPUSFLOW — Unified Worker
# Notification gateway + R2 storage + Push + Cron
# v3.0.0 — School notifications + Enhanced R2
# ══════════════════════════════════════════════════════════

name = "campusflow-worker"
account_id = "29af63e0139b75f78259902d4ee51e07"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ── KV Namespaces ────────────────────────────────────────
# IDs récupérés depuis: npx wrangler kv namespace list
[[kv_namespaces]]
binding = "NOTIFICATION_CACHE"
id = "993474323b2f4d3ca34a03b56df98713"

[[kv_namespaces]]
binding = "PUSH_TOKEN_CACHE"
id = "8a56cb5cc94642cebf2ffbbdb3a2326c"

[[kv_namespaces]]
binding = "UNREAD_COUNTERS"
id = "317732e686984fcaa7fce3ed7d61cc57"

[[kv_namespaces]]
binding = "USER_PREFERENCES"
id = "a69d6d564ebf4137802f80d4bbb72a87"

# ── Queue (disabled — free tier uses direct push) ────────
# To use queue-based push on Workers Paid ($5/mo), uncomment:
# [[queues.producers]]
# queue = "notification-push-queue"
# binding = "PUSH_QUEUE"

# ── Cron Triggers ────────────────────────────────────────
# Runs every hour to check for:
# - Prayer requests without responses (48h+)
# - Evaluation reminders (J-1)
[triggers]
crons = ["0 * * * *"]

# ── Environment Variables ────────────────────────────────
[vars]
VAPID_EMAIL = "mailto:kleintaptue1@gmail.com"
# Rate limits
RATE_LIMIT_PUSH_INTERVAL_MS = "10000"    # 10s between pushes per user
RATE_LIMIT_HOURLY_MAX = "50"             # Max 50 notifs/hour per user
BROADCAST_RATE_LIMIT_MS = "100"          # 10 req/s for broadcasts

# ── Secrets (set via CLI, not stored in file) ────────────
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_SERVICE_KEY
# npx wrangler secret put VAPID_PUBLIC_KEY
# npx wrangler secret put VAPID_PRIVATE_KEY
# npx wrangler secret put ADMIN_KEY

# ── R2 Bucket (10GB free Cloudflare R2) ──────────────────
[[r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "campusflow-actifs"

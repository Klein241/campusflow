  # DO NOT commit secrets to version control

# ═══ Edge Functions ═══
# org-manifest: generates a per-tenant PWA manifest (runs BEFORE domain-router)
[[edge_functions]]
  path = "/:orgSlug/manifest.webmanifest"
  function = "org-manifest"

# domain-router: detects custom domains and rewrites paths to /_/ prefix
# so that the /:orgSlug/* redirect rules below can match them.
[[edge_functions]]
  path = "/*"
  function = "domain-router"

# ═══ SPA REDIRECTS for dynamic [orgSlug] routes ═══
# These rewrite any /:orgSlug/* path to the static _/ placeholder pages.
# The client-side JS reads the actual URL to determine the real orgSlug.
# Order matters: most specific first.

[[redirects]]
  from = "/:orgSlug/campus/*"
  to = "/_/campus/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/login/*"
  to = "/_/login/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/admin/*"
  to = "/_/admin/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/library/*"
  to = "/_/library/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/shop/*"
  to = "/_/shop/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/messages/*"
  to = "/_/messages/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/student/dashboard/*"
  to = "/_/student/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/student/*"
  to = "/_/student/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/prof/dashboard/*"
  to = "/_/prof/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/prof/*"
  to = "/_/prof/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/f/:slug"
  to = "/_/f/_/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/f/:slug/*"
  to = "/_/f/_/index.html"
  status = 200

[[redirects]]
  from = "/f/:slug"
  to = "/_/f/_/index.html"
  status = 200

[[redirects]]
  from = "/f/:slug/*"
  to = "/_/f/_/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/"
  to = "/_/index.html"
  status = 200

# Superadmin — must come before the /* fallback
[[redirects]]
  from = "/superadmin"
  to = "/superadmin/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/index.html"
  status = 200

# Verify certificate SPA route
[[redirects]]
  from = "/verify/*"
  to = "/verify/index.html"
  status = 200

# Fallback SPA for any unmatched route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ═══ Security headers ═══
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA manifest (generic)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA manifest (per-tenant, served by org-manifest edge function)
[[headers]]
  for = "/:orgSlug/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

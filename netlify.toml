# ═══ SPA REDIRECTS for dynamic [orgSlug] routes ═══
# These rewrite any /:orgSlug/* path to the static _/ placeholder pages.
# The client-side JS reads the actual URL to determine the real orgSlug.
# Order matters: most specific first.

[[redirects]]
  from = "/:orgSlug/campus/*"
  to = "/_/campus/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/login/*"
  to = "/_/login/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/admin/*"
  to = "/_/admin/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/library/*"
  to = "/_/library/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/shop/*"
  to = "/_/shop/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/messages/*"
  to = "/_/messages/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/student/dashboard/*"
  to = "/_/student/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/student/*"
  to = "/_/student/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/prof/dashboard/*"
  to = "/_/prof/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/prof/*"
  to = "/_/prof/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/f/:slug/*"
  to = "/_/f/_/index.html"
  status = 200

[[redirects]]
  from = "/:orgSlug/"
  to = "/_/index.html"
  status = 200

# Fallback SPA for any unmatched route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ═══ Security headers ═══
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
